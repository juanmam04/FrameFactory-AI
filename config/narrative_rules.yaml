  Planos oscuros creíbles: dormitorio con poca luz, móvil iluminando la cara, pasillo de noche, puerta entreabierta,
  cocina en silencio tenso, pantalla de ordenador en penumbra, salón vacío con sensación de ruido extraño;
  tensión, nada decorativo ni “stock feliz”.
