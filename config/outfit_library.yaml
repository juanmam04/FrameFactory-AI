# =============================================================================
# PROP LIBRARY — Objetos que el personaje puede tener o que aparecen en la escena
# Hacen la escena más narrativa. Se seleccionan según contexto.
# =============================================================================
props:
  laptop:
    prompt: "laptop or computer visible in scene"
    keywords: [computadora, ordenador, laptop, pc, trabajo, office, escritorio, desk]
  weapon:
    prompt: "weapon or threat object (suggested, not graphic) if context implies danger"
    keywords: [arma, armas, disparo, disparos, amenaza, peligro, weapon, gun, danger]
  football:
    prompt: "football or ball in scene"
    keywords: [fútbol, futbol, balón, pelota, ball, cancha, sports, deporte]
  phone:
    prompt: "phone or mobile device in scene"
    keywords: [teléfono, telefono, móvil, celular, phone, llamada, mensaje]
  suitcase:
    prompt: "suitcase or bag in scene"
    keywords: [maleta, equipaje, viaje, suitcase, bag, huir, escapar]
  money:
    prompt: "money or cash suggested in scene (stacks, briefcase, exchange)"
    keywords: [dinero, efectivo, cash, pago, negocio, deal, maletín, briefcase]
  microphone:
    prompt: "microphone or interview setup in scene"
    keywords: [micrófono, microfono, entrevista, entrevista, prensa, microphone, interview]
  controller:
    prompt: "game controller or keyboard in scene"
    keywords: [consola, control, controller, mando, teclado, keyboard, gaming, videojuego]

# Máximo de props a mencionar por escena (evitar prompt sobrecargado)
max_props_per_scene: 3
