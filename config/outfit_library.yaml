# =============================================================================
# OUTFIT LIBRARY — Ropa del personaje según contexto narrativo
# La identidad (cara circular, ojos negros, estilo stickman) NUNCA cambia.
# Solo la vestimenta y los props cambian según la escena.
# =============================================================================

# Mapeo: tipo de escena (inferido por keywords) -> clave del outfit
scene_type_to_outfit:
  war: war_outfit
  crime: criminal_outfit
  business: business_outfit
  sports: athlete_outfit
  gaming: gamer_outfit
  childhood: kid_outfit
  casual: casual_outfit

# Orden en que se comprueban los tipos (el primero que coincida con keywords gana)
scene_type_priority: [war, crime, business, sports, gaming, childhood]

outfits:
  casual_outfit:
    prompt: |
      Character wearing casual outfit: hoodie or t-shirt, jeans or casual pants, sneakers.
      Used for: daily life, home, walking in city, neutral moments.
  kid_outfit:
    prompt: |
      Character as a child: simple t-shirt, shorts or simple pants, sneakers.
      Proportions must reflect a younger body (child). Same face and stickman style; only age-appropriate clothing and proportions.
  gamer_outfit:
    prompt: |
      Character wearing gamer outfit: hoodie, headphones, casual pants.
      Optional in scene: controller, keyboard, desk chair. Used in gaming or computer scenes.
  athlete_outfit:
    prompt: |
      Character wearing athlete outfit: football/sports jersey, shorts, sport shoes.
      Optional: team colors, stadium or sports environment. Used in sports scenes.
  business_outfit:
    prompt: |
      Character wearing business outfit: suit jacket, formal pants, dress shoes.
      Optional environment: office, boardroom, city skyline. Used in business or power scenes.
  criminal_outfit:
    prompt: |
      Character wearing criminal outfit: dark hoodie, dark jacket, simple pants.
      Atmosphere: night scenes, tense environments. Used in crime-related scenes.
  war_outfit:
    prompt: |
      Character wearing military/tactical outfit: military gear, tactical vest, boots.
      Environment: battlefield, ruined buildings, conflict. Used in war or conflict scenes.

