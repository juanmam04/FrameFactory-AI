# FASE 1–2: Biblia visual
# Estilo fijo: stickman (cuerpo blanco, contorno negro, cabeza redonda, ojos de punto). La escena y el personaje se adaptan al guion: narco, futbolista, lo que sea.

estilo_base: "stickman style: dark outline, round head, dot eyes, simple 2D cartoon, clean lines, simple flat colors limited palette. Character and setting must match the scene."

iluminacion:
  - "luz suave y direccional"
  - "sombras definidas pero no duras"
  - "sin reflejos excesivos"

camara:
  variedad_planos:
    - "plano general"
    - "plano medio"
    - "primer plano"
    - "plano detalle"
  reglas:
    - "evitar repetición del mismo plano en escenas consecutivas"
    - "ángulo de cámara bajo para momentos dramáticos"
    - "ángulo neutro para narración"

atmosfera:
  - "ambiente minimalista"
  - "fondos simples que no distraigan"
  - "paleta limitada y coherente"

duracion_por_imagen_segundos: 5
formato_guion: "narrativo por párrafos, cada párrafo/acción = una escena"

# Negative prompt fijo para evitar desvíos de estilo y elementos no deseados
negative_prompt: "blurry, low quality, distorted, text, watermark, 3D, realistic, photo, cartoon color, messy lines, cluttered background, video player, playback bar, timeline, timecode, grid lines, editor interface, UI overlay, floating, flying, surreal"

# Regla para TODAS las imágenes: un solo fotograma de ilustración, solo contenido de escena
prohibido_en_imagen: "Un solo fotograma de ilustración. Solo el contenido dibujado de la escena visible. Composición limpia, sin overlays, sin texto, sin controles ni interfaz. Sin figuras flotando o volando."
