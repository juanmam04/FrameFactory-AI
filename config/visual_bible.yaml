# Visual Bible – cartoon cinematográfico + referencia de personaje (Kontext / prompts)

style_lock: |
  Cinematic 2D storyboard / explainer style: clean bold outlines, flat or soft cel shading, readable silhouette.
  Protagonist is ALWAYS the same stick-figure / minimalist design as the reference image: large white round head, simple black eyes (dots or ovals), thin limbs, same body scale in every shot.
  When Replicate uses a character reference PNG (Kontext), copy that exact head shape, eye style, line weight and outfit colors—do not invent a different face or body type.
  Backgrounds: narrative and readable with depth; match the same 2D cartoon lighting language.
  No photorealistic humans, no anime eyes, no 3D Pixar render look.

character_universe_rule: |
  All characters share the same cinematic cartoon universe.
  The protagonist is locked to the spherical white head + simple black eyes; identity across frames is silhouette, outfit and pose.
  Secondary characters: simplified faces and same line/shading language; no hyper-realistic facial detail.

camera_options:
  - wide shot
  - medium shot
  - close up
  - side shot
  - over the shoulder
  - top down
  - low angle
  - rear view

camera_rule: "Do not repeat the same camera type in two consecutive images."

extras_rule: |
  Background extras use the same cinematic cartoon style: simple readable bodies, no photorealistic faces.
  Keep them smaller and less detailed than the main subject.

negative_prompt: >
  anime, manga, pixar, 3d render, realistic human, photorealistic,
  overly detailed painting, hyper textured skin, messy composition,
  duplicate characters, extra arms, extra legs, extra fingers, extra heads,
  text overlay, subtitles, UI, video player, controls, timeline, watermark,
  empty white background, letterboxing, black bars, pillarboxing, widescreen mattes

# Referencias de personaje (rutas relativas al raíz del proyecto).
# La app Streamlit guarda subidas en character_reference/ — estas rutas deben coincidir.
# Replicate: con REPLICATE_API_TOKEN, Kontext usa este PNG (input_image) si el archivo existe.
character_reference:
  front: "character_reference/character_reference_front.png"
  side: "character_reference/character_reference_side.png"
  # closeup: "character_reference/character_reference_closeup.png"

# Opcional: sobrescribe la instrucción que se antepone al prompt en Kontext.
# kontext_context_instruction: |
#   ...

# Tamaño por defecto para video 16:9 (se puede sobreescribir por proyecto)
parametros_sd:
  width: 1920
  height: 1080
  steps: 25
