# Visual Bible – cartoon cinematográfico + referencia de personaje (Kontext / prompts)

style_lock: |
  Cinematic cartoon storyboard illustration, clean bold outlines, soft directional lighting.
  Main character: always the same design in every frame.
  Large perfectly white spherical head (emoji-like); two simple black oval eyes; no realistic nose or mouth unless the scene needs a tiny simple mouth line.
  Young-adult human body proportions (not a stick figure): same limb length, torso width and head scale in all scenes.
  Default outfit unless the script overrides: dark zip hoodie (often open) over white tee, blue jeans, grey low-top sneakers.
  Consistent line thickness, readable silhouette, subtle shading for depth (not flat poster style, not 3D Pixar).
  Backgrounds: narrative and readable, with clear depth; match the same cartoon-cinematic lighting quality.
  No photorealistic humans, no anime eyes, no 3D render look.

character_universe_rule: |
  All characters share the same cinematic cartoon universe.
  The protagonist is locked to the spherical white head + simple black eyes; identity across frames is silhouette, outfit and pose.
  Secondary characters: simplified faces and same line/shading language; no hyper-realistic facial detail.

camera_options:
  - wide shot
  - medium shot
  - close up
  - side shot
  - over the shoulder
  - top down
  - low angle
  - rear view

camera_rule: "Do not repeat the same camera type in two consecutive images."

extras_rule: |
  Background extras use the same cinematic cartoon style: simple readable bodies, no photorealistic faces.
  Keep them smaller and less detailed than the main subject.

negative_prompt: >
  anime, manga, pixar, 3d render, realistic human, photorealistic,
  overly detailed painting, hyper textured skin, messy composition,
  duplicate characters, extra arms, extra legs, extra fingers, extra heads,
  text overlay, subtitles, UI, video player, controls, timeline, watermark,
  empty white background

# Referencias de personaje (rutas relativas al raíz del proyecto).
# Colocá tu PNG en references/character_reference/character_reference_front.png
# Replicate: con REPLICATE_API_TOKEN, todas las escenas usan FLUX Kontext con este PNG (input_image) si el archivo existe.
character_reference:
  front: "references/character_reference/character_reference_front.png"
  # side: "references/character_reference/character_reference_side.png"
  # closeup: "references/character_reference/character_reference_closeup.png"

# Opcional: sobrescribe la instrucción que se antepone al prompt en Kontext.
# kontext_context_instruction: |
#   ...

# Tamaño por defecto para video 16:9 (se puede sobreescribir por proyecto)
parametros_sd:
  width: 1920
  height: 1080
  steps: 25
