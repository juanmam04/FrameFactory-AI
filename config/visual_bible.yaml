# Visual Bible – versión simplificada para storyboard stickman 2D

style_lock: |
  Flat 2D storyboard illustration, clean and cinematic.
  Main character: always the same design in every frame.
  White round face with simple dark brown hair, black simple eyes and simple mouth.
  Clean black outline, stickman-like body with slightly thicker torso and limbs.
  Large, readable face with simple expressive eyebrows when needed.
  Simple flat clothing with limited colors, no complex textures or wrinkles.
  Same character proportions, head size and line thickness in all scenes.
  Backgrounds: simple but narrative, with clear depth and thematic details.
  No realistic rendering, no anime, no 3D, no Pixar; consistent cartoon style.

character_universe_rule: |
  All characters share the same flat 2D stickman visual universe.
  Face is always minimal (no realistic details): white circular head, simple black eyes, simple mouth.
  Identity is defined by body preset, outfit base, color identity, silhouette hint and simple accessories.
  Facial details must never be realistic or unique; silhouette and outfit define each character.

camera_options:
  - wide shot
  - medium shot
  - close up
  - side shot
  - over the shoulder
  - top down
  - low angle
  - rear view

camera_rule: "Do not repeat the same camera type in two consecutive images."

extras_rule: |
  Background extras must use the same flat stickman visual style.
  Keep them small, simple and not individually detailed.
  No realistic humans, no unique faces.
  Use only clear role silhouettes and flat clothing colors.

negative_prompt: >
  anime, manga, pixar, 3d render, realistic human, photorealistic,
  overly detailed painting, hyper textured clothing, messy composition,
  duplicate characters, extra arms, extra legs, extra fingers, extra heads,
  text overlay, subtitles, UI, video player, controls, timeline, watermark,
  empty white background

# Tamaño por defecto para video 16:9 (se puede sobreescribir por proyecto)
parametros_sd:
  width: 1920
  height: 1080
  steps: 25

