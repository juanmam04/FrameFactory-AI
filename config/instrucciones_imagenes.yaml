parametros_sd:
  cfg_scale: 7.0
  height: 1080
  steps: 25
  width: 1920
# El estilo (stickman 2D, etc.) es regla general: se inyecta en código desde visual_bible.yaml, no se repite aquí.
# Este template solo define el contenido variable por escena.
prompt_template: |
  Plano: {plano}. Acción coherente con la escena: {accion}. Emoción: {emocion}. Fase: {fase_psicologica}. Momento: {momento_de_la_historia}.

  Iluminación coherente con el estado emocional. Formato 16:9, encuadre claro.
reintentos:
  max_reintentos: 3
  pausa_segundos: 5
