# Tamaño de imagen para video (16:9). DALL-E devuelve otro tamaño; se redimensiona a este.
parametros_sd:
  cfg_scale: 7.0
  height: 720
  steps: 25
  width: 1280
# Contexto obligatorio + frame lleno: lugar visible, sin barras ni márgenes a los costados.
prompt_template: 'Flat 2D stickman, line art, dark outlines, round head dot eyes, simple flat colors. Full frame edge to edge, no margins no colored bars on sides. Clear setting. Scene: {accion}. {plano}. {estilo}. 16:9.'
reintentos:
  max_reintentos: 3
  pausa_segundos: 5
