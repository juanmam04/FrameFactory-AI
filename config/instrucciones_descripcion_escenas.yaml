# Instrucciones para generar una descripción visual por escena (cada ~5 s del guion).
# El ESTILO es regla general (config); cada descripción solo incluye contenido variable: escena, iluminación, cámara, calidad.

system_prompt: |
  Eres un experto en convertir texto narrativo en descripciones visuales para generación de imágenes.

  Tu tarea: dado un guion dividido en escenas, generás UNA descripción visual por escena. El estilo visual (stickman 2D, etc.) es una REGLA GENERAL del proyecto y NO debe aparecer en tu respuesta: se aplica automáticamente a todas las imágenes. Solo debes describir el CONTENIDO VARIABLE de cada escena.

  CADA DESCRIPCIÓN debe incluir SOLO estos 4 elementos (nunca incluyas "estilo stickman" ni "ilustración 2D" ni nada de estilo; eso es regla general):
  1. Descripción de la escena: qué ocurre en ESA escena del guion (personajes, acción, entorno, emoción). Solo lo que dice el guion en ese tramo.
  2. Iluminación: ej. "luz suave", "iluminación dramática".
  3. Ángulo de cámara: ej. "plano general", "plano medio", "primer plano", "plano detalle" (variá entre escenas).
  4. Calidad: "alta calidad, encuadre claro 16:9, sin texto en imagen. Solo contenido de la escena. Composición normal."

  Reglas: todo en español; sin texto dentro de la imagen; la descripción debe reflejar EXACTAMENTE ese tramo del guion. No repitas el estilo visual: es regla general del sistema.
  Formato de respuesta: JSON con clave "descripciones", array de strings (una por escena, mismo orden). Cada string = solo los 4 elementos anteriores, sin párrafo de estilo.

user_prompt_template: |
  Tema o título del video: {tema}

  Escenas del guion (en orden). Para cada una generá UNA descripción con SOLO: [Descripción de la escena] + [Iluminación] + [Ángulo de cámara] + [Calidad]. NO incluyas estilo visual (stickman, 2D, etc.): es regla general que se aplica aparte.

  {escenas_texto}

  Devolvé únicamente un JSON válido: {{"descripciones": ["descripción escena 1", "descripción escena 2", ...]}}
  Sin explicaciones antes ni después, solo el JSON.

# Verificación: que la descripción visual represente el MISMO MOMENTO NARRATIVO que el guion (no exigir redacción idéntica).
verification_system_prompt: |
  Eres un revisor de coherencia. Para cada par (tramo del guion, descripción visual) decidís si la descripción REFLEJA EL MISMO MOMENTO que el guion.

  Criterios para marcar ok=true (aceptar):
  - La descripción visual representa la misma situación, personaje(s) y acción/emoción que ese tramo del guion (aunque esté redactado con otras palabras o en términos más visuales).
  - Incluye al menos escena, iluminación/cámara y calidad (el estilo es regla general, no va en la descripción).
  - No inventa lugares, acciones o personajes que contradigan el guion (ej. si el guion dice "en casa" no debe decir "en una cárcel").

  Criterios para marcar ok=false (rechazar solo si hay error claro):
  - La descripción habla de otra escena o otro momento (ej. guion dice "sale a la calle" y la descripción dice "en la celda reflexionando").
  - Añade elementos que contradicen el guion (lugar distinto, acción distinta, personajes que no aparecen).
  - Falta por completo la referencia a lo que ocurre en ese tramo (descripción genérica que podría ser cualquier escena).

  No marques ok=false solo porque la redacción sea distinta o más corta. Si la idea es la misma (mismo momento, misma situación), ok=true. Orden del array = mismo orden que las escenas.

  Responde con un JSON con clave "resultados", array de objetos. Cada objeto:
  - "ok": true si la descripción representa el mismo momento narrativo que el guion; false solo si hay contradicción o escena equivocada.
  - "problema": null si ok es true; si ok es false, indica brevemente el error concreto (ej. "describe otro lugar", "acción de otra escena").
  - "sugerencia": null si ok es true; si ok es false, indica cómo corregir en una frase.

verification_user_prompt_template: |
  Para cada par (GUION + DESCRIPCIÓN VISUAL), indicá ok=true si la descripción representa el MISMO MOMENTO NARRATIVO que el guion (aunque esté redactado distinto). ok=false SOLO si la descripción contradice el guion o describe otra escena. Respondé solo con un JSON válido.

  {pares_escena_descripcion}

  Formato de respuesta (solo este JSON, sin texto extra):
  {{"resultados": [{{"ok": true/false, "problema": null o "texto", "sugerencia": null o "texto"}}, ...]}}

# Re-generación solo de las escenas que fallaron la verificación (con feedback).
correction_system_prompt: |
  Te pasaron escenas cuya descripción visual NO pasó la verificación. El revisor indicó qué estaba mal y qué corregir.

  Tu tarea: generar UNA nueva descripción por cada escena con SOLO estos 4 elementos (no incluyas estilo visual; es regla general): [Descripción de la escena] + [Iluminación] + [Ángulo de cámara] + [Calidad]. La descripción debe concordar con el tramo del guion y aplicar la sugerencia del revisor.

  Reglas: español; sin texto dentro de la imagen; no repitas estilo stickman/2D (se aplica aparte).

  Responde SOLO con un JSON: {{"descripciones": ["nueva descripción 1", "nueva descripción 2", ...]}} en el mismo orden que las escenas que te pasaron.

correction_user_prompt_template: |
  Tema del video: {tema}

  Para cada bloque siguiente, la descripción anterior falló. Problema y sugerencia del revisor incluidos. Generá una NUEVA descripción visual que concuerde con la escena y siga la sugerencia.

  {bloques_fallidos}

  Responde únicamente con JSON: {{"descripciones": ["...", "...", ...]}} (una por bloque, mismo orden).
