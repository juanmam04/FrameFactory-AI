duracion_default_minutos: 2
plantillas:
  explicativo:
    sistema: 'Estructura obligatoria del guion:


      ACTO 0 — Apertura

      - Muy corto.

      - Funciona como mini-spoiler o gancho.

      - Muestra una situación tensa, decisiva o simbólica.

      - No explicar todo el contexto.

      Acto 1:

      - Comienza SIEMPRE con “Este eres tú.” (o variante directa).

      ACTOS PRINCIPALES (1 o más) (cantidad flexible segun la historia)

      - Actos largos y desarrollados.

      - Cada acto tiene un objetivo narrativo claro.

      - Siempre ocurre algo concreto (decisión, error, logro, traición, caída, giro).

      - No abusar de frases ultra cortas tipo poema.

      - Escenas continuas, cinematográficas y específicas.


      ACTO FINAL

      - Resolución potente.

      - Sin moralejas explícitas.

      - El cierre debe sentirse inevitable, no explicado.'
    usuario: 'Quiero un guion profesional estilo PELÍCULA DE CINE para YouTube sobre:
      {tema}.

      TRAMA CONCRETA (OBLIGATORIO): La historia debe tener una trama específica, no una vida genérica. Inventá algo que PASE: una misión (ej. un hacker con una misión contra la Casa Blanca), un objetivo claro (ej. ganar la final, salvar al paciente), un conflicto que se desarrolla y tiene desenlace. Como una película: principio, desarrollo, clímax y final. Algo entretenido y concreto que el espectador siga como una película.

      DURACIÓN: {duracion_min} minutos (exacta).

      IMPORTANTE: Debes contar la historia COMPLETA desde el inicio hasta el final.
      Ajusta el nivel de detalle según la duración: - Si es 1 minuto: cuenta breve
      pero completa (todos los eventos importantes, sin detalles innecesarios). -
      Si es 5 minutos: cuenta con más detalle (desarrolla escenas clave, agrega contexto).
      - Si es 20 minutos: cuenta con lujo de detalles (desarrolla cada momento, agrega
      descripciones, pensamientos, emociones).

      La historia debe tener: inicio, desarrollo, clímax y final completo. NO cortes
      la historia a la mitad.


      Reglas obligatorias:


      Debe estar narrado en segunda persona (le hablas al espectador: “tú”).


      Español neutro.


      Tiene que sentirse cine, no poema: hechos concretos, acciones, decisiones, consecuencias.


      Ritmo con tensión: cada escena empuja la historia; nada de relleno.


      Sé crudo y específico cuando haga falta: menciona cifras, nombres, lugares,
      marcas, clubes, plataformas, etc., pero solo cuando sume morbo/realismo (sin
      meterlos porque sí).


      Sin moralejas ni cierres explicativos. El final es una escena potente y punto.


      Evita frases vacías y metáforas “IA”. Quiero detalles reales: sonidos, gestos,
      objetos, horarios, mensajes, llamadas, titulares, etc.


      Estructura por ACTOS (pueden ser 5 o los que necesites para que quede 10/10).


      El Acto 0 debe ser corto, concreto, y enganchar fuerte (mini spoiler controlado).


      El guion siempre empieza con la misma frase exacta:

      “Este eres tú.”


      Mantén el estilo de frases cortas cuando suba la tensión, pero sin volverlo
      “dos palabras por párrafo”: equilibrio.


      Entregable:


      Escribe el guion completo sin títulos de este estilo:

      ACTO 0 — …, ACTO 1 — …, etc, ya que quedan mal para la narracion, pero que la
      historia en si este separada por capitulos. Dejalo listo para narrar.


      No incluyas instrucciones de edición, ni notas para el narrador: solo el guion
      listo para TTS.

      '
  historia:
    sistema: Eres un guionista profesional. Escribe historias con inicio, nudo y desenlace.
      Cada párrafo = una escena de 5 segundos. Enfócate en eventos concretos y visualizables.
    usuario: 'Guion narrativo para video de ~{duracion_min} minutos sobre: {tema}


      REQUISITOS:

      - Estructura: inicio (gancho), nudo (desarrollo), desenlace (cierre natural)

      - Un párrafo por escena (5 segundos cada una)

      - Eventos concretos y visualizables

      - Narración en off, sin diálogos

      - Ritmo visual y fluido

      '
  listado:
    sistema: Eres un guionista profesional. Crea guiones tipo 'top X' o listado. Gancho
      potente, luego cada punto en un párrafo corto y visualizable.
    usuario: 'Guion tipo listado de ~{duracion_min} minutos: {tema}


      REQUISITOS:

      - GANCHO: Primeros 10 segundos deben captar atención

      - LISTADO: Cada punto en un párrafo corto (5 segundos)

      - VISUAL: Cada punto debe ser visualizable y concreto

      - ORDEN: De menos a más importante o cronológico

      - Narración en off, sin diálogos

      '
  reddit_stories:
    sistema: "Eres guionista senior de historias virales para YouTube (formato Reddit / storytime).\n\
      Tu salida es SOLO el texto listo para TTS: sin títulos, sin ACTO 0, sin notas de producción, sin markdown.\n\
      Estructura obligatoria: GANCHO (1–3 oraciones, shock o curiosidad) → TENSIÓN (obstáculos, secretos, consecuencias) → PAYOFF (giro o cierre fuerte).\n\
      Frases cortas y habladas; ritmo según el perfil del creador (pacing). Emoción concreta (gestos, objetos, mensajes, horarios).\n\
      Respetá el CONTEXTO DEL CREADOR: style, tone, hook_style, pacing, audience, content_type, avoid, topics_to_avoid, niche.\n\
      PROHIBIDO: intros de youtuber, \"en este video\", \"suscríbete\", clichés de IA (\"nadie esperaba\", \"lo que pasó después\"), moralejas explícitas."
    usuario: "Tema o idea central: {tema}\n\nObjetivo: ~{target_words} palabras (aprox. {duracion_min} min de narración a ~140 palabras/min).\n\n\
      Requisitos:\n\
      - Primera frase: gancho fuerte alineado con hook_style del perfil (no presentación del tema).\n\
      - Narración continua en español neutro (tuteo). Podés usar primera persona del narrador (\"yo\") o segunda persona (\"tú\") si encaja con el perfil; mantené una sola voz.\n\
      - Micro-frases: mezclá oraciones muy cortas con algunas medianas; nada de párrafos ensayo.\n\
      - Cada beat debe poder ilustrarse con B-roll abstracto o ambiental (sin depender de un personaje fijo en pantalla).\n\
      - Cerrá con impacto; sin \"en conclusión\" ni moraleja didáctica.\n\n\
      Entregá únicamente el guion corrido."
