[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "framefactory-ai"
version = "0.1.0"
description = "FrameFactory Documentary Studio"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "requests>=2.28.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "pydub>=0.25.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "psycopg[binary]>=3.1.0",
  "python-multipart>=0.0.9",
  "Pillow>=10.0.0",
  "mangum>=0.17.0",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.0",
]

[tool.vercel]
entrypoint = "app:app"

