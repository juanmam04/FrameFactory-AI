<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#f4f6f8"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="FrameFactory"/>
  <meta name="format-detection" content="telephone=no"/>
  <title>FrameFactory Studio</title>
  <link rel="manifest" href="/assets/manifest.webmanifest"/>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg?v=20260814x"/>
  <link rel="icon" type="image/png" href="/assets/logo.png?v=20260814x"/>
  <link rel="apple-touch-icon" href="/assets/logo.png?v=20260814x"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/studio.css?v=20260815e"/>
  <!-- Critical: keep top nav + render actions centered (Vercel serves public/) -->
  <style>
    .top-inner { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; min-height: 2.75rem; }
    .top-nav {
      position: absolute !important;
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
      display: flex !important;
      justify-content: center !important;
      z-index: 2;
    }
    .top-status { margin-left: auto; }
    .actions.actions-center { justify-content: center !important; }
    @media (max-width: 860px) {
      .top-inner { flex-wrap: wrap; }
      .top-nav {
        position: static !important;
        left: auto !important;
        top: auto !important;
        transform: none !important;
        order: 3;
        width: 100%;
      }
    }
    /* Boot shell — visible before JS/CSS finish so the page never looks empty */
    .boot-shell { animation: bootRise 420ms ease both; }
    .boot-shell .boot-hero {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 860px) {
      .boot-shell .boot-hero { grid-template-columns: 1fr; }
    }
    .boot-card {
      background: #fff;
      border: 1px solid rgba(15, 23, 32, 0.08);
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(15, 23, 32, 0.06);
      padding: 1.4rem 1.5rem;
    }
    .boot-kicker {
      margin: 0 0 0.55rem;
      color: #0f766e;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .boot-title {
      margin: 0 0 0.55rem;
      font-size: clamp(1.55rem, 5vw, 2.4rem);
      line-height: 1.12;
      letter-spacing: -0.04em;
      font-weight: 800;
      color: #0f1720;
    }
    .boot-lead {
      margin: 0 0 1rem;
      color: #5b6775;
      font-size: 1.02rem;
      line-height: 1.55;
      max-width: 34rem;
    }
    .boot-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.35rem;
    }
    .boot-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #0f766e;
      box-shadow: 0 0 0 0 rgba(15, 118, 110, 0.45);
      animation: bootPulse 1.2s infinite;
      flex: 0 0 auto;
    }
    .boot-meta {
      margin: 0;
      font-weight: 700;
      color: #0f1720;
      font-size: 0.95rem;
    }
    .boot-skel {
      border-radius: 12px;
      background: linear-gradient(90deg, #eef2f6 0%, #f7f9fb 45%, #eef2f6 100%);
      background-size: 200% 100%;
      animation: bootShimmer 1.35s linear infinite;
    }
    .boot-skel.line { height: 12px; margin: 0.65rem 0; }
    .boot-skel.line.w60 { width: 60%; }
    .boot-skel.line.w80 { width: 80%; }
    .boot-skel.block { height: 118px; margin-top: 0.85rem; }
    .boot-list .boot-skel.line { margin: 0.9rem 0; }
    @keyframes bootPulse {
      70% { box-shadow: 0 0 0 12px rgba(15, 118, 110, 0); }
      100% { box-shadow: 0 0 0 0 rgba(15, 118, 110, 0); }
    }
    @keyframes bootShimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    @keyframes bootRise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-inner">
        <div class="top-brand" data-go="home">
          <strong>FrameFactory</strong>
          <small>100 Days Studio</small>
        </div>
        <nav class="top-nav">
          <button type="button" data-go="home" class="nav-link active">Home</button>
          <button type="button" data-go="ideas" class="nav-link">New episode</button>
          <button type="button" data-go="library" class="nav-link">Library</button>
        </nav>
        <div class="top-status" id="cred-pills"></div>
      </div>
    </header>

    <main id="stage" class="stage">
      <section class="boot-shell" aria-busy="true" aria-live="polite">
        <div class="boot-hero">
          <div class="boot-card">
            <p class="boot-kicker">100 Days Studio</p>
            <h1 class="boot-title">FrameFactory</h1>
            <p class="boot-lead">Preparando tu espacio de episodios…</p>
            <div class="boot-row">
              <span class="boot-dot" aria-hidden="true"></span>
              <p class="boot-meta" id="boot-status">Cargando canal y proyectos</p>
            </div>
            <div class="boot-skel line w80" aria-hidden="true"></div>
            <div class="boot-skel line w60" aria-hidden="true"></div>
          </div>
          <div class="boot-card">
            <p class="boot-kicker">Progreso</p>
            <div class="boot-skel block" aria-hidden="true"></div>
            <div class="boot-skel line w60" aria-hidden="true"></div>
          </div>
        </div>
        <div class="boot-card boot-list">
          <p class="boot-kicker">Episodios recientes</p>
          <div class="boot-skel line" aria-hidden="true"></div>
          <div class="boot-skel line w80" aria-hidden="true"></div>
          <div class="boot-skel line w60" aria-hidden="true"></div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>
    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <div class="pulse"></div>
        <p id="overlay-text">Working…</p>
      </div>
    </div>
  </div>
  <script src="/assets/studio.js?v=20260815e" type="module"></script>
</body>
</html>
