{% extends "layouts/base_app.html" %}
{% block title %}Ajustes · FrameFactory{% endblock %}
{% block content %}
<h1 class="ff-page-title">Ajustes</h1>
<p class="ff-page-sub">Identidad de la cuenta.</p>
<form method="post" class="ff-card" style="max-width:480px;">
  <div class="ff-form-row">
    <label class="ff-label" for="name">Nombre visible</label>
    <input class="ff-input" id="name" name="name" value="{{ user.name or '' }}"/>
  </div>
  <div class="ff-form-row">
    <label class="ff-label" for="new_password">Nueva contraseña (opcional)</label>
    <input class="ff-input" id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password"/>
  </div>
  <button type="submit" class="ff-btn ff-btn-primary">Guardar</button>
</form>
{% endblock %}
