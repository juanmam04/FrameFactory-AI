{% extends "layouts/base_app.html" %}
{% block title %}Perfil creativo · FrameFactory{% endblock %}
{% block content %}
<h1 class="ff-page-title">Perfil creativo</h1>
<p class="ff-page-sub">Este JSON guía al LLM en guion y montaje (compatible con el motor existente).</p>
<form method="post" class="ff-card">
  <div class="ff-form-row">
    <label class="ff-label" for="payload">Perfil (JSON)</label>
    <textarea class="ff-textarea" id="payload" name="payload" rows="18" style="font-family:ui-monospace,monospace;font-size:0.82rem;">{{ profile_json }}</textarea>
  </div>
  <button type="submit" class="ff-btn ff-btn-primary">Guardar</button>
</form>
{% endblock %}
