{% extends "layouts/base_admin.html" %}
{% block title %}Admin · Planes{% endblock %}
{% block content %}
<h1 class="ff-page-title">Planes</h1>
<p class="ff-page-sub">Precios en centavos de USD; tokens mensuales de referencia.</p>
<div class="ff-grid cols-1" style="max-width:720px;">
  {% for p in plans %}
  <form method="post" action="/admin/plans/{{ p.id }}" class="ff-card">
    <h3 style="margin:0 0 12px;"><code>{{ p.slug }}</code></h3>
    <div class="ff-form-row">
      <label class="ff-label">Nombre</label>
      <input class="ff-input" name="name" value="{{ p.name }}"/>
    </div>
    <div class="ff-grid cols-2">
      <div class="ff-form-row">
        <label class="ff-label">Precio mensual (centavos)</label>
        <input class="ff-input" name="monthly_price_cents" type="number" value="{{ p.monthly_price_cents }}"/>
      </div>
      <div class="ff-form-row">
        <label class="ff-label">Tokens / mes</label>
        <input class="ff-input" name="monthly_token_allowance" type="number" value="{{ p.monthly_token_allowance }}"/>
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin:12px 0;color:var(--ff-muted);font-size:0.9rem;">
      <input type="checkbox" name="is_active" value="1" {% if p.is_active %}checked{% endif %}/> Plan activo
    </label>
    <button type="submit" class="ff-btn ff-btn-primary">Guardar cambios</button>
  </form>
  {% endfor %}
</div>
{% endblock %}
