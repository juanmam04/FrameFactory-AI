{% extends "layouts/base_admin.html" %}
{% block title %}Admin · Usuarios{% endblock %}
{% block content %}
<h1 class="ff-page-title">Usuarios</h1>
<div class="ff-table-wrap">
  <table class="ff-table">
    <thead><tr><th>ID</th><th>Email</th><th>Rol</th><th>Activo</th><th>Tokens</th><th>Acciones</th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.email }}</td>
        <td><span class="ff-badge ff-badge-muted">{{ u.role }}</span></td>
        <td>{% if u.is_active %}Sí{% else %}No{% endif %}</td>
        <td>{{ u.balance }}</td>
        <td>
          <form method="post" action="/admin/users/{{ u.id }}/tokens" style="display:inline-flex;gap:6px;align-items:center;">
            <input type="hidden" name="reason" value="admin_adjustment"/>
            <input class="ff-input" name="delta" type="number" placeholder="+100" style="width:100px;padding:6px 8px;"/>
            <button class="ff-btn ff-btn-ghost" type="submit" style="padding:6px 10px;">Ajustar</button>
          </form>
          <form method="post" action="/admin/users/{{ u.id }}/role" style="display:inline;margin-left:8px;">
            <input type="hidden" name="toggle" value="1"/>
            <button class="ff-btn ff-btn-ghost" type="submit" style="padding:6px 10px;">Toggle admin</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
