<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}FrameFactory{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', path='css/design-system.css') }}"/>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="ff-topbar">
    <div class="ff-topbar-inner">
      <a class="ff-brand" href="/">
        <span class="ff-brand-mark" aria-hidden="true"></span>
        FrameFactory
      </a>
      <nav class="ff-nav">
        <a href="/features">Producto</a>
        <a href="/pricing">Planes</a>
        <a href="/faq">FAQ</a>
        <a href="/login">Iniciar sesión</a>
        <a class="ff-btn ff-btn-primary" href="/register" style="padding:8px 14px;font-size:0.88rem;">Crear cuenta</a>
      </nav>
    </div>
  </header>
  {% block body %}{% endblock %}
  <footer class="ff-foot">
    © {{ now_year }} FrameFactory · Plataforma para creadores
  </footer>
</body>
</html>
