<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Admin · FrameFactory{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', path='css/design-system.css') }}"/>
</head>
<body>
  <div class="ff-shell">
    <aside class="ff-sidebar">
      <div class="ff-side-brand">Control center</div>
      <nav class="ff-side-nav">
        <a href="/admin" class="{{ 'active' if nav=='dash' }}">Resumen</a>
        <a href="/admin/users" class="{{ 'active' if nav=='users' }}">Usuarios</a>
        <a href="/admin/projects" class="{{ 'active' if nav=='projects' }}">Proyectos</a>
        <a href="/admin/plans" class="{{ 'active' if nav=='plans' }}">Planes</a>
        <a href="/admin/catalog" class="{{ 'active' if nav=='catalog' }}">Catálogo</a>
        <a href="/admin/tokens" class="{{ 'active' if nav=='tokens' }}">Tokens</a>
        <a href="/app/dashboard" style="margin-top:14px;">← Volver al producto</a>
      </nav>
    </aside>
    <div class="ff-main">
      <div class="ff-main-inner">
        {% if flash_error %}<div class="ff-alert ff-alert-error">{{ flash_error }}</div>{% endif %}
        {% if flash_ok %}<div class="ff-alert ff-alert-info">{{ flash_ok }}</div>{% endif %}
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</body>
</html>
