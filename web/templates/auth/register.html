{% extends "layouts/base_public.html" %}
{% block title %}Crear cuenta — FrameFactory{% endblock %}
{% block body %}
<section class="ff-section" style="max-width:440px;padding-top:56px;">
  <h1 class="ff-page-title">Crear cuenta</h1>
  <p class="ff-page-sub">Onboarding guiado después del registro.</p>
  {% if error %}<div class="ff-alert ff-alert-error">{{ error }}</div>{% endif %}
  <form method="post" class="ff-card">
    <div class="ff-form-row">
      <label class="ff-label" for="name">Nombre</label>
      <input class="ff-input" id="name" name="name" required maxlength="120"/>
    </div>
    <div class="ff-form-row">
      <label class="ff-label" for="email">Email</label>
      <input class="ff-input" id="email" name="email" type="email" required autocomplete="email"/>
    </div>
    <div class="ff-form-row">
      <label class="ff-label" for="password">Contraseña</label>
      <input class="ff-input" id="password" name="password" type="password" required minlength="8" autocomplete="new-password"/>
    </div>
    <button type="submit" class="ff-btn ff-btn-primary" style="width:100%;">Continuar</button>
  </form>
  <p style="text-align:center;margin-top:18px;color:var(--ff-muted);">¿Ya tenés cuenta? <a href="/login">Iniciar sesión</a></p>
</section>
{% endblock %}
