{% extends "layouts/base_public.html" %}
{% block title %}Nueva contraseña — FrameFactory{% endblock %}
{% block body %}
<section class="ff-section" style="max-width:420px;padding-top:56px;">
  <h1 class="ff-page-title">Nueva contraseña</h1>
  {% if error %}<div class="ff-alert ff-alert-error">{{ error }}</div>{% endif %}
  <form method="post" class="ff-card">
    <input type="hidden" name="token" value="{{ token }}"/>
    <div class="ff-form-row">
      <label class="ff-label" for="password">Nueva contraseña</label>
      <input class="ff-input" id="password" name="password" type="password" minlength="8" required/>
    </div>
    <button type="submit" class="ff-btn ff-btn-primary" style="width:100%;">Guardar</button>
  </form>
</section>
{% endblock %}
