{% extends "layouts/base_public.html" %}
{% block title %}Iniciar sesión — FrameFactory{% endblock %}
{% block body %}
<section class="ff-section" style="max-width:420px;padding-top:56px;">
  <h1 class="ff-page-title">Bienvenido de nuevo</h1>
  <p class="ff-page-sub">Accedé a tu espacio de trabajo.</p>
  {% if error %}<div class="ff-alert ff-alert-error">{{ error }}</div>{% endif %}
  <form method="post" class="ff-card">
    <div class="ff-form-row">
      <label class="ff-label" for="email">Email</label>
      <input class="ff-input" id="email" name="email" type="email" required autocomplete="username"/>
    </div>
    <div class="ff-form-row">
      <label class="ff-label" for="password">Contraseña</label>
      <input class="ff-input" id="password" name="password" type="password" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="ff-btn ff-btn-primary" style="width:100%;">Entrar</button>
    <p style="margin-top:14px;font-size:0.9rem;color:var(--ff-muted);"><a href="/auth/forgot">¿Olvidaste la contraseña?</a></p>
  </form>
  <p style="text-align:center;margin-top:18px;color:var(--ff-muted);">¿No tenés cuenta? <a href="/register">Registrate</a></p>
</section>
{% endblock %}
