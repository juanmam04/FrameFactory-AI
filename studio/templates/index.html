<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FrameFactory Studio</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/studio.css?v=20260813j"/>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-brand" data-go="home">
        <img class="mark" src="/assets/logo.svg" alt="FrameFactory" width="34" height="34"/>
        <div>
          <strong>FrameFactory</strong>
          <small>100 Days Studio</small>
        </div>
      </div>
      <nav class="top-nav">
        <button type="button" data-go="home" class="nav-link active">Home</button>
        <button type="button" data-go="ideas" class="nav-link">New episode</button>
        <button type="button" data-go="library" class="nav-link">Library</button>
      </nav>
      <div class="top-status" id="cred-pills"></div>
    </header>

    <main id="stage" class="stage"></main>

    <div id="toast" class="toast hidden"></div>
    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <div class="pulse"></div>
        <p id="overlay-text">Working…</p>
      </div>
    </div>
  </div>
  <script src="/assets/studio.js?v=20260813j" type="module"></script>
</body>
</html>
