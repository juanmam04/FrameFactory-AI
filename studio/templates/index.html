<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#f4f6f8"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="FrameFactory"/>
  <meta name="format-detection" content="telephone=no"/>
  <title>FrameFactory Studio</title>
  <link rel="manifest" href="/assets/manifest.webmanifest"/>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg?v=20260814q"/>
  <link rel="icon" type="image/png" href="/assets/logo.png?v=20260814q"/>
  <link rel="apple-touch-icon" href="/assets/logo.png?v=20260814q"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/studio.css?v=20260814u"/>
  <!-- Critical: keep top nav centered even if CSS asset is cached/stale on Vercel -->
  <style>
    .top-inner { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; min-height: 2.75rem; }
    .top-nav {
      position: absolute !important;
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
      display: flex !important;
      justify-content: center !important;
      z-index: 2;
    }
    .top-status { margin-left: auto; }
    @media (max-width: 860px) {
      .top-inner { flex-wrap: wrap; }
      .top-nav {
        position: static !important;
        left: auto !important;
        top: auto !important;
        transform: none !important;
        order: 3;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-inner">
        <div class="top-brand" data-go="home">
          <strong>FrameFactory</strong>
          <small>100 Days Studio</small>
        </div>
        <nav class="top-nav">
          <button type="button" data-go="home" class="nav-link active">Home</button>
          <button type="button" data-go="ideas" class="nav-link">New episode</button>
          <button type="button" data-go="library" class="nav-link">Library</button>
        </nav>
        <div class="top-status" id="cred-pills"></div>
      </div>
    </header>

    <main id="stage" class="stage"></main>

    <div id="toast" class="toast hidden"></div>
    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <div class="pulse"></div>
        <p id="overlay-text">Working…</p>
      </div>
    </div>
  </div>
  <script src="/assets/studio.js?v=20260814q" type="module"></script>
</body>
</html>
