name: Editorial Studio checks
on:
  push:
    branches: [main, feature/editorial-preproduction-flow, fix/framefactory-complete-workflow]
  pull_request:
    paths:
      - 'studio/editorial.py'
      - 'studio/editorial_script.py'
      - 'studio/server.py'
      - 'studio/templates/editorial.html'
      - 'studio/static/creative-studio.js'
      - 'studio/static/studio.js'
      - 'public/index.html'
      - 'src/documentary/visual_director.py'
      - 'src/documentary/youtube_pack.py'
      - 'tests/test_editorial_workflow.py'
      - 'tests/test_story_matrix.py'
      - 'studio/story_architect.py'
      - 'tests/test_editorial_end_to_end.py'
      - 'src/documentary/project.py'
      - 'src/documentary/script_service.py'
      - 'src/documentary/visual_plan.py'
      - 'scripts/sync_public_studio.py'
  workflow_dispatch:
jobs:
  editorial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Python syntax check
        run: python -m py_compile studio/editorial.py studio/editorial_script.py studio/story_architect.py studio/server.py src/documentary/visual_director.py src/documentary/youtube_pack.py
      - name: Client JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("studio/templates/editorial.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          assert match, "Editorial UI script missing"
          Path("/tmp/framefactory-editorial.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/framefactory-editorial.js
          node --check studio/static/creative-studio.js
          node --check public/assets/creative-studio.js
          node --check public/assets/studio.js
          node scripts/test_creative_recovery.mjs
      - name: Editorial unit tests
        run: python -m pytest tests/test_story_matrix.py tests/test_editorial_workflow.py tests/test_editorial_end_to_end.py tests/test_documentary_visual_plan.py tests/test_studio_episode.py tests/test_studio_voice.py -q
      - name: Studio import and editorial page smoke check
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from studio.server import studio_app
          client = TestClient(studio_app)
          response = client.get("/editorial")
          assert response.status_code == 200, response.text[:400]
          assert response.url.path == "/"
          assert client.get("/").status_code == 200
          assert client.get("/api/ping").status_code == 200
          print("Editorial Studio smoke checks passed")
          PY
      - name: Vercel public assets consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          script=Path("public/assets/studio.js").read_text()
          assert "creative-studio.css" in html
          assert 'renderCreativeStudio(stage(), openProject)' in script
          assert './creative-studio.js' in script
          assert Path("public/assets/creative-studio.js").is_file()
          assert Path("public/assets/creative-studio.css").is_file()
          print("Public assets synced")
          PY
